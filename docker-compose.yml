# SIMS Plus - Docker Compose for Local Development
#
# Usage:
#   cp .env.example .env       # First time only
#   docker-compose up -d       # Start all services
#   docker-compose logs -f     # Watch logs
#
# With optional tools:
#   docker-compose --profile tools up -d   # Includes Adminer, MailHog, MinIO
#
# SECURITY NOTE: Backend connects as sims_app_user (non-superuser).
# RLS policies are enforced. Only Alembic migrations use the superuser.

services:
  # =========================
  # PostgreSQL 16 Database
  # =========================
  db:
    image: postgres:16-alpine
    container_name: sims-plus-db
    restart: unless-stopped
    # Raise max_connections for parallel test runs that open many sessions
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sims_plus}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sims_plus"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================
  # Redis 7 Cache
  # =========================
  redis:
    image: redis:7-alpine
    container_name: sims-plus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================
  # Nginx Reverse Proxy
  # Handles wildcard subdomain routing for local development
  # =========================
  nginx:
    image: nginx:1.25-alpine
    container_name: sims-plus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # =========================
  # Backend (FastAPI)
  # CRITICAL: Connects as sims_app_user (non-superuser, RLS enforced)
  # =========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: sims-plus-backend
    restart: unless-stopped
    environment:
      # CRITICAL: Use sims_app_user (non-superuser). RLS is enforced.
      # DO NOT change this to postgres. Doing so bypasses ALL tenant isolation.
      DATABASE_URL: postgresql+asyncpg://sims_app_user:${APP_DB_PASSWORD:-app_password}@db:5432/${POSTGRES_DB:-sims_plus}
      # Alembic uses postgres superuser for DDL (CREATE TABLE, ALTER TABLE, CREATE FUNCTION)
      # sims_admin has CREATEDB but NOT SUPERUSER — can't replace functions owned by postgres
      # NOTE: Alembic requires the sync driver (postgresql://, not postgresql+asyncpg://)
      ALEMBIC_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sims_plus}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-only-not-for-production-change-me-openssl-rand-base64-64-minimum-64-chars}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: '["http://localhost:3000","http://frontend:3000","http://localhost:80","http://localhost"]'
      # SMTP (defaults point to MailHog for local dev)
      SMTP_HOST: mailhog
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_START_TLS: ${SMTP_START_TLS:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@simsplus.io}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-SIMS Plus}
      # AWS S3 (defaults point to MinIO for local dev)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-sims-plus-dev}
      S3_ENDPOINT_URL: http://minio:9000
      USE_MINIO: "true"
      # Error tracking
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # =========================
  # Celery Worker (Background Tasks)
  # Processes tasks dispatched by the backend and beat scheduler.
  # Uses the same image and env as backend but runs the celery worker command.
  # =========================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: sims-plus-celery-worker
    restart: unless-stopped
    environment:
      # Same credentials as backend — worker needs DB and Redis access
      DATABASE_URL: postgresql+asyncpg://sims_app_user:${APP_DB_PASSWORD:-app_password}@db:5432/${POSTGRES_DB:-sims_plus}
      ALEMBIC_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sims_plus}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-only-not-for-production-change-me-openssl-rand-base64-64-minimum-64-chars}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # SMTP (same as backend for email tasks)
      SMTP_HOST: mailhog
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_START_TLS: ${SMTP_START_TLS:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@simsplus.io}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-SIMS Plus}
      # Error tracking
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2

  # =========================
  # Celery Beat (Task Scheduler)
  # Dispatches periodic tasks on schedule (trial warnings, cleanup, reminders).
  # Only ONE beat instance should run at a time to avoid duplicate scheduling.
  # =========================
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: sims-plus-celery-beat
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://sims_app_user:${APP_DB_PASSWORD:-app_password}@db:5432/${POSTGRES_DB:-sims_plus}
      ALEMBIC_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sims_plus}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-only-not-for-production-change-me-openssl-rand-base64-64-minimum-64-chars}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # SMTP not needed for beat (it only dispatches, worker sends)
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
    command: celery -A app.celery_app beat --loglevel=info

  # =========================
  # Frontend (Next.js 16)
  # =========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: sims-plus-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_APP_NAME: SIMS Plus
      API_URL: http://backend:8000/api/v1
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: npm run dev

  # =========================
  # Adminer (Database GUI) - Development Only
  # Usage: docker-compose --profile tools up -d adminer
  # Access: http://localhost:8080
  # =========================
  adminer:
    image: adminer:latest
    container_name: sims-plus-adminer
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db

  # =========================
  # MailHog (Email Testing) - Development Only
  # Usage: docker-compose --profile tools up -d mailhog
  # SMTP: localhost:1025 | Web UI: http://localhost:8025
  # =========================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: sims-plus-mailhog
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "1025:1025"
      - "8025:8025"

  # =========================
  # MinIO (S3-Compatible Storage) - Development Only
  # Usage: docker-compose --profile tools up -d minio
  # API: localhost:9000 | Console: http://localhost:9001
  # =========================
  minio:
    image: minio/minio:latest
    container_name: sims-plus-minio
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    name: sims-plus-postgres
  redis_data:
    name: sims-plus-redis
  frontend_node_modules:
    name: sims-plus-frontend-node-modules
  frontend_next:
    name: sims-plus-frontend-next
  minio_data:
    name: sims-plus-minio

networks:
  default:
    name: sims-plus-network
