# SIMS Plus - Alembic Configuration

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Set to 'true' to run in "offline" mode
prepend_sys_path = .

# Timezone for migration timestamps
timezone = UTC

# Max migration file name length
truncate_slug_length = 40

# Set to true to run in "offline" mode
# This runs migrations as plain SQL without connecting to database
revision_environment = false

# Use batch mode for SQLite (not needed for PostgreSQL)
# render_as_batch = true

# Database URL (will be overridden by env.py)
# DO NOT put actual credentials here - use environment variables
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
