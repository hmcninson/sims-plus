# ============================================================
# SIMS Plus - Nginx Configuration
# ============================================================
# Handles wildcard subdomain routing for both local development
# and production (without SSL — SSL terminates at Cloudflare/ALB).
#
# Routes:
#   /api/*          -> FastAPI backend (port 8000)
#   /health         -> FastAPI backend (no rate limit)
#   /docs, /redoc   -> FastAPI backend (Swagger)
#   /*              -> Next.js frontend (port 3000)
#
# Subdomain extraction:
#   presec.localhost      -> X-Subdomain: presec
#   presec.simsplus.io    -> X-Subdomain: presec
# ============================================================

upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# ============================================================
# Production: Wildcard *.simsplus.io
# ============================================================
server {
    listen 80;
    server_name ~^(?P<subdomain>[a-z0-9][a-z0-9-]*[a-z0-9])\.simsplus\.io$
                ~^(?P<subdomain>[a-z0-9])\.simsplus\.io$;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self)" always;

    # Auth endpoints — strict rate limit (5 req/min)
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Subdomain $subdomain;
    }

    # General API — standard rate limit (100 req/min)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Subdomain $subdomain;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Health check — no rate limit
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Swagger docs
    location /docs {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Frontend (everything else)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Subdomain $subdomain;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    client_max_body_size 10M;
}

# ============================================================
# Local Development: Wildcard *.localhost
# ============================================================
server {
    listen 80;
    server_name ~^(?P<subdomain>[a-z0-9][a-z0-9-]*[a-z0-9])\.localhost$
                ~^(?P<subdomain>[a-z0-9])\.localhost$
                ~^(?P<subdomain>[a-z0-9][a-z0-9-]*[a-z0-9])\.127\.0\.0\.1$
                ~^(?P<subdomain>[a-z0-9])\.127\.0\.0\.1$;

    # Security headers (same as production)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self)" always;

    # Auth endpoints — strict rate limit
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Subdomain $subdomain;
    }

    # General API
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Subdomain $subdomain;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Health check — no rate limit
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Swagger docs
    location /docs {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Next.js HMR WebSocket
    location /_next/webpack-hmr {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Subdomain $subdomain;
    }

    # Frontend (everything else)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Subdomain $subdomain;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    client_max_body_size 10M;
}

