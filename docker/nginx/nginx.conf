# ============================================================
# Bare production domain redirect
# simsplus.io / www.simsplus.io -> app.simsplus.io
# ============================================================
server {
    listen 80;
    server_name simsplus.io www.simsplus.io;
    return 301 https://app.simsplus.io$request_uri;
}
