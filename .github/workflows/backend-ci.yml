# SIMS Plus Backend CI Pipeline
name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

jobs:
  # ============================
  # Lint + Type Check
  # ============================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Install type stubs
        run: pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

      - name: Check formatting with Ruff
        run: ruff format --check .

      # CRITICAL: Detect the forbidden import that breaks 204 responses
      - name: Check for forbidden __future__ annotations in endpoints
        run: |
          if grep -r "from __future__ import annotations" app/api/v1/endpoints/; then
            echo ""
            echo "ERROR: 'from __future__ import annotations' found in endpoint files!"
            echo "This breaks FastAPI 204 responses (causes AssertionError)."
            echo "Remove this import from all files under app/api/v1/endpoints/"
            exit 1
          fi
          echo "PASS: No forbidden __future__ imports in endpoint files."

  # ============================
  # Test
  # ============================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sims_plus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Create sims_app_user and RLS helper functions in test DB
      # This mirrors what init-db.sql does in Docker
      - name: Set up test database (sims_app_user + RLS functions)
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: sims_plus_test
        run: |
          # Create sims_admin role (DDL/migrations user)
          psql -c "
            DO \$\$
            BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'sims_admin') THEN
                    CREATE ROLE sims_admin WITH LOGIN PASSWORD 'admin_password' CREATEDB;
                END IF;
            END \$\$;
          "

          # Create sims_app_user role (runtime user, RLS enforced)
          # Must be created BEFORE ALTER DEFAULT PRIVILEGES that reference it
          psql -c "
            DO \$\$
            BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'sims_app_user') THEN
                    CREATE ROLE sims_app_user WITH LOGIN PASSWORD 'app_password';
                END IF;
            END \$\$;
          "

          # Grant sims_admin permissions
          psql -c "GRANT CONNECT ON DATABASE sims_plus_test TO sims_admin;"
          psql -c "GRANT ALL PRIVILEGES ON SCHEMA public TO sims_admin;"
          # Objects created by sims_admin (e.g. Alembic migrations) are accessible to sims_app_user
          psql -c "ALTER DEFAULT PRIVILEGES FOR ROLE sims_admin IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO sims_app_user;"
          psql -c "ALTER DEFAULT PRIVILEGES FOR ROLE sims_admin IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO sims_app_user;"
          psql -c "ALTER DEFAULT PRIVILEGES FOR ROLE sims_admin IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO sims_app_user;"

          # Grant sims_app_user permissions
          psql -c "GRANT CONNECT ON DATABASE sims_plus_test TO sims_app_user;"
          psql -c "GRANT USAGE ON SCHEMA public TO sims_app_user;"
          psql -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO sims_app_user;"
          psql -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO sims_app_user;"
          psql -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO sims_app_user;"

          # Create extensions
          psql -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
          psql -c "CREATE EXTENSION IF NOT EXISTS \"pgcrypto\";"

          # Create RLS helper functions
          psql -c "
            CREATE OR REPLACE FUNCTION set_tenant_context(tenant_uuid UUID)
            RETURNS VOID AS \$\$
            BEGIN
                PERFORM set_config('app.current_tenant_id', tenant_uuid::TEXT, true);
            END;
            \$\$ LANGUAGE plpgsql;

            CREATE OR REPLACE FUNCTION clear_tenant_context()
            RETURNS VOID AS \$\$
            BEGIN
                PERFORM set_config('app.current_tenant_id', '', true);
            END;
            \$\$ LANGUAGE plpgsql;

            CREATE OR REPLACE FUNCTION get_current_tenant_id()
            RETURNS UUID AS \$\$
            DECLARE
                tenant_str TEXT;
                tenant_uuid UUID;
            BEGIN
                tenant_str := current_setting('app.current_tenant_id', true);
                IF tenant_str IS NULL OR tenant_str = '' THEN
                    RETURN NULL;
                END IF;
                BEGIN
                    tenant_uuid := tenant_str::UUID;
                    RETURN tenant_uuid;
                EXCEPTION WHEN OTHERS THEN
                    RETURN NULL;
                END;
            END;
            \$\$ LANGUAGE plpgsql STABLE;
          "

          # Grant functions to sims_app_user
          psql -c "GRANT EXECUTE ON FUNCTION set_tenant_context(UUID) TO sims_app_user;"
          psql -c "GRANT EXECUTE ON FUNCTION clear_tenant_context() TO sims_app_user;"
          psql -c "GRANT EXECUTE ON FUNCTION get_current_tenant_id() TO sims_app_user;"

          echo "Test database setup complete."

      - name: Run tests
        env:
          # Tests use sims_app_user so RLS is enforced during tests
          DATABASE_URL: postgresql+asyncpg://sims_app_user:app_password@localhost:5432/sims_plus_test
          # Admin URL for test setup (DDL operations that need superuser)
          DATABASE_ADMIN_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sims_plus_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-minimum-32-characters-for-validation
          ENVIRONMENT: testing
        run: pytest --cov=app --cov-report=xml -x

      - name: Verify RLS policies are enforced
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: sims_plus_test
        run: |
          echo "Verifying RLS is enabled on tenant-scoped tables..."

          # Run Alembic migrations first to create tables
          DATABASE_URL=postgresql+asyncpg://sims_admin:admin_password@localhost:5432/sims_plus_test \
          SECRET_KEY=ci-test-secret-key-minimum-32-characters-for-validation \
          ENVIRONMENT=testing \
          alembic upgrade head

          # Check that RLS is enabled on key tenant-scoped tables
          TABLES="users students staff classes subjects academic_years terms invoices payments"
          FAIL=0
          for table in $TABLES; do
            RLS=$(psql -t -A -c "SELECT relforcerowlevelsecurity FROM pg_class WHERE relname = '$table';" 2>/dev/null || echo "missing")
            if [ "$RLS" = "t" ]; then
              echo "  ✓ $table: RLS FORCED"
            elif [ "$RLS" = "f" ]; then
              echo "  ✗ $table: RLS NOT FORCED"
              FAIL=1
            else
              echo "  ? $table: table not found (may not exist yet)"
            fi
          done

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "ERROR: Some tables do not have FORCE ROW LEVEL SECURITY enabled!"
            exit 1
          fi
          echo ""
          echo "All checked tables have RLS enforced."

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
        continue-on-error: true

  # ============================
  # Migration Test
  # ============================
  migration-test:
    name: Migration Test
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sims_plus_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create extensions and RLS functions
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: sims_plus_migration_test
        run: |
          psql -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
          psql -c "CREATE EXTENSION IF NOT EXISTS \"pgcrypto\";"
          psql -c "
            CREATE OR REPLACE FUNCTION set_tenant_context(tenant_uuid UUID)
            RETURNS VOID AS \$\$ BEGIN PERFORM set_config('app.current_tenant_id', tenant_uuid::TEXT, true); END; \$\$ LANGUAGE plpgsql;

            CREATE OR REPLACE FUNCTION clear_tenant_context()
            RETURNS VOID AS \$\$ BEGIN PERFORM set_config('app.current_tenant_id', '', true); END; \$\$ LANGUAGE plpgsql;

            CREATE OR REPLACE FUNCTION get_current_tenant_id()
            RETURNS UUID AS \$\$
            DECLARE tenant_str TEXT; tenant_uuid UUID;
            BEGIN
                tenant_str := current_setting('app.current_tenant_id', true);
                IF tenant_str IS NULL OR tenant_str = '' THEN RETURN NULL; END IF;
                BEGIN tenant_uuid := tenant_str::UUID; RETURN tenant_uuid;
                EXCEPTION WHEN OTHERS THEN RETURN NULL; END;
            END; \$\$ LANGUAGE plpgsql STABLE;
          "

      - name: Run all migrations on clean database
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sims_plus_migration_test
          SECRET_KEY: ci-test-secret-key-minimum-32-characters-for-validation
          ENVIRONMENT: testing
        run: |
          alembic upgrade head
          echo "All migrations applied successfully."

      - name: Verify migration can downgrade
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sims_plus_migration_test
          SECRET_KEY: ci-test-secret-key-minimum-32-characters-for-validation
          ENVIRONMENT: testing
        run: |
          alembic downgrade -1
          alembic upgrade head
          echo "Migration downgrade/upgrade cycle successful."

  # ============================
  # Build Docker Image
  # ============================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, migration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: sims-plus-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
